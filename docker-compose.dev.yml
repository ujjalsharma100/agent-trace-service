# Local development stack for Phase 3 (and daily hacking): Postgres + agent-trace-service.
#
# From this directory:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Service: http://localhost:5000  ·  Admin: X-Admin-Secret: dev-admin-secret
# Postgres on host port 5433 → container 5432 (use localhost:5433 in DBeaver etc.)
#
# Database schema is applied on container start (init_db create + migrate).
# To run init_db manually instead (e.g. after wiping the volume), exec into the app:
#   docker compose -f docker-compose.dev.yml exec agent-trace-service \
#     sh -c "python init_db.py create && python init_db.py migrate"
#
# Stop and remove DB volume:
#   docker compose -f docker-compose.dev.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_trace
    volumes:
      - agent_trace_dev_pg:/var/lib/postgresql/data
    ports:
      # Host 5433 avoids conflict when another Postgres already uses 5432 locally.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 15

  agent-trace-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: agent_trace
      ADMIN_SECRET: dev-admin-secret
      PORT: "5000"
      FLASK_DEBUG: "0"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python init_db.py create && python init_db.py migrate && exec python app.py"

volumes:
  agent_trace_dev_pg:
