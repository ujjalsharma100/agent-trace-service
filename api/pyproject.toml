[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracehub-api"
version = "0.0.0"
description = "TracesHub hub API (FastAPI control plane)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["tracehub_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
